<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flesan - Assets CDN</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23FF0000'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <div class="brand">
        <span class="brand-mark">F</span>
        <span class="brand-name">FLESAN</span>
      </div>
      <span class="brand-tag">Assets CDN</span>
    </div>
  </header>

  <main class="main">
    <section class="hero container">
      <h1>Repositorio de Assets</h1>
      <p class="hero-text">Galería de imágenes y recursos estáticos servidos de forma pública a través de GitHub Pages. La lista se genera automáticamente desde el repositorio.</p>
      <div class="search-wrap">
        <input type="search" id="search" placeholder="Buscar asset por nombre o carpeta..." autocomplete="off">
        <span id="count-badge" class="badge">0 assets</span>
      </div>
    </section>

    <div id="content" class="content container">
      <div class="loading"><span class="spinner"></span><p>Cargando assets...</p></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Servido desde <a href="https://github.com/I-C-Flesan/assets-flesan" target="_blank" rel="noopener">github.com/I-C-Flesan/assets-flesan</a> vía GitHub Pages</p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
